name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v5
      - name: Build and test ExitAtlasCore
        run: swift test --parallel

  web-tests:
    name: Web engine tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test the JavaScript engine against the route fixtures
        working-directory: web
        run: npm test
      - name: Test the key proxy Worker
        working-directory: infra/worker
        run: npm test

  web-layout:
    name: Web Drive and Road Ahead layout (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        working-directory: web
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Drive screen at phone sizes, both presentations, light and dark
        run: node web/tests/layout/drive.layout.mjs
      - name: Road Ahead timeline, filters and alert sheet at phone sizes, light and dark
        run: node web/tests/layout/ahead.layout.mjs

  ios-app:
    name: iOS app build and screenshots (Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: App
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))] | last | .udid')
          NAME=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))] | last | .name')
          echo "Using $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and run UI screenshot tests
        working-directory: App
        run: |
          xcodebuild -project ExitAtlas.xcodeproj -scheme ExitAtlas \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO -quiet test
      - name: Check the app bundle (privacy manifest, data manifest)
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name ExitAtlas.app -type d | head -1)
          echo "$APP"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Data/manifest.json"
          plutil -p "$APP/Info.plist" | grep -E "ITSAppUsesNonExemptEncryption|NSLocation" 
      - name: Test failures (messages and where they happened)
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/ui.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/ui.xcresult" | jq '.testFailures' || true
          fi
          # A crash leaves a report; print the top of any for the app.
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i exitatlas | head -3 | while read f; do echo "== $f"; head -60 ~/Library/Logs/DiagnosticReports/"$f"; done || true
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d "$RUNNER_TEMP/ui.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path screenshots || true
          fi
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
