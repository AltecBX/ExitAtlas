name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build and test ExitAtlasCore
        run: swift test --parallel

  ios-build:
    name: iOS app build (Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: App
        run: xcodegen generate
      - name: Build for iOS Simulator
        working-directory: App
        run: |
          xcodebuild -project ExitAtlas.xcodeproj -scheme ExitAtlas \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO -quiet build
