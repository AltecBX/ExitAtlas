# XcodeGen spec. Generate the Xcode project on a Mac:
#   brew install xcodegen
#   cd App && xcodegen generate && open ExitAtlas.xcodeproj
name: ExitAtlas
options:
  bundleIdPrefix: com.cobyconstruction
  # iOS 18 runs on the same iPhones as iOS 17 (XS, XR and later) and adds the small Live Activity
  # family used by the CarPlay Dashboard and Apple Watch.
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
packages:
  ExitAtlas:
    path: ..
  # Experimental Google navigation mode only (target ExitAtlasGoogle, docs/14). The ExitAtlas target never links it.
  GoogleNavigation:
    url: https://github.com/googlemaps/ios-navigation-sdk
    exactVersion: 11.2.0
targets:
  ExitAtlas:
    type: application
    platform: iOS
    sources:
      - path: ExitAtlas
        excludes:
          - "Resources/Data/**"
          - "PrivacyInfo.xcprivacy"
      - path: ExitAtlas/Resources/Data
        type: folder
        buildPhase: resources
      - path: ExitAtlas/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: ExitAtlas
        product: ExitAtlasCore
      - target: ExitAtlasWidgets
    scheme:
      testTargets:
        - ExitAtlasUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobyconstruction.exitatlas
        INFOPLIST_FILE: ExitAtlas/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: ExitAtlas/Info.plist
      properties:
        CFBundleDisplayName: ExitAtlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts:
          - Overpass-SemiBold.ttf
          - Overpass-Bold.ttf
          - Overpass-ExtraBold.ttf
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: >-
          ExitAtlas uses your location to show the exits ahead, how far you are from the next
          state line, and your progress through each state on your route.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          ExitAtlas keeps tracking your trip progress, state line distances and upcoming exits
          while the screen is off or another app is open.
        ITSAppUsesNonExemptEncryption: false
        # canOpenURL("waze://") to hand a destination to Waze, or its App Store page when it is not installed.
        LSApplicationQueriesSchemes:
          - waze
  # Experimental: the same app with Google's navigation (Navigation SDK) as an optional mode, for real
  # device tests (docs/14). Same bundle identifier, so installing it over ExitAtlas keeps every saved
  # preference, and installing ExitAtlas again removes Google. Code for it is under #if GOOGLE_NAVIGATION.
  ExitAtlasGoogle:
    type: application
    platform: iOS
    sources:
      - path: ExitAtlas
        excludes:
          - "Resources/Data/**"
          - "PrivacyInfo.xcprivacy"
          # The regular app's generated Info.plist; this target has its own (ExitAtlasGoogle/Info.plist).
          - "Info.plist"
      - path: ExitAtlas/Resources/Data
        type: folder
        buildPhase: resources
      - path: ExitAtlas/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: ExitAtlas
        product: ExitAtlasCore
      - package: GoogleNavigation
        product: GoogleNavigation
      - target: ExitAtlasWidgets
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobyconstruction.exitatlas
        INFOPLIST_FILE: ExitAtlasGoogle/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) GOOGLE_NAVIGATION
        # Google's libraries are static; their Objective-C categories need -ObjC (Google's setup guide).
        OTHER_LDFLAGS: $(inherited) -ObjC
    info:
      path: ExitAtlasGoogle/Info.plist
      properties:
        CFBundleDisplayName: ExitAtlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts:
          - Overpass-SemiBold.ttf
          - Overpass-Bold.ttf
          - Overpass-ExtraBold.ttf
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: >-
          ExitAtlas uses your location to show the exits ahead, how far you are from the next
          state line, and your progress through each state on your route.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          ExitAtlas keeps tracking your trip progress, state line distances and upcoming exits
          while the screen is off or another app is open. In Google navigation, Google's guidance
          and alerts continue in the background.
        # Google's Navigation SDK asks for this from version 11 (altitude from the barometer).
        NSMotionUsageDescription: >-
          Google navigation uses the motion sensors to estimate altitude and keep the route accurate.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - waze
  ExitAtlasWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ExitAtlasWidgets
      - path: Shared
      - path: ExitAtlas/Design/Tokens.swift
    dependencies:
      - package: ExitAtlas
        product: ExitAtlasCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobyconstruction.exitatlas.widgets
        INFOPLIST_FILE: ExitAtlasWidgets/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: ExitAtlasWidgets/Info.plist
      properties:
        CFBundleDisplayName: ExitAtlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ExitAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ExitAtlasUITests
    dependencies:
      - target: ExitAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobyconstruction.exitatlas.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ExitAtlas
