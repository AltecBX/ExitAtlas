# XcodeGen spec. Generate the Xcode project on a Mac:
#   brew install xcodegen
#   cd App && xcodegen generate && open ExitAtlas.xcodeproj
name: ExitAtlas
options:
  bundleIdPrefix: com.cobyconstruction
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
packages:
  ExitAtlas:
    path: ..
targets:
  ExitAtlas:
    type: application
    platform: iOS
    sources:
      - path: ExitAtlas
        excludes:
          - "Resources/Data/**"
      - path: ExitAtlas/Resources/Data
        type: folder
        buildPhase: resources
    dependencies:
      - package: ExitAtlas
        product: ExitAtlasCore
    scheme:
      testTargets:
        - ExitAtlasUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobyconstruction.exitatlas
        INFOPLIST_FILE: ExitAtlas/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: ExitAtlas/Info.plist
      properties:
        CFBundleDisplayName: ExitAtlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: >-
          ExitAtlas uses your location to show the exits ahead, how far you are from the next
          state line, and your progress through each state on your route.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          ExitAtlas keeps tracking your trip progress, state line distances and upcoming exits
          while the screen is off or another app is open.
        ITSAppUsesNonExemptEncryption: false
  ExitAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ExitAtlasUITests
    dependencies:
      - target: ExitAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobyconstruction.exitatlas.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ExitAtlas
