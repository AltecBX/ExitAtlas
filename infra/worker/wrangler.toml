# ExitAtlas key proxy. Deploy steps: README.md in this folder.
name = "exitatlas-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Pages that may call the proxy (comma separated).
ALLOWED_ORIGINS = "https://altecbx.github.io"
# Daily budgets: all clients together, and each client (by hashed IP). 0 means no limit.
# Each counted call writes 2 KV keys; the Workers Free plan allows 1,000 KV writes a day, so these
# defaults (230 calls, 460 writes) fit it. Raise them only on Workers Paid. Google prices stay at 30 a day,
# the same as the daily quota on the Google Cloud project (docs/17), so they stay under Google's 1,000 free a month.
DAILY_PRICES = "30"
CLIENT_DAILY_PRICES = "30"
DAILY_CHARGERS = "200"
CLIENT_DAILY_CHARGERS = "40"
# Shared gas price reports (docs/17): daily budgets, well under the D1 Free limits. Leave as is unless the
# numbers in README.md say otherwise.
DAILY_PRICE_REPORTS = "2000"
CLIENT_DAILY_PRICE_REPORTS = "20"
DAILY_PRICE_READS = "5000"
# Off switches the app reads from /v1/config: any of prices, chargers, routing, search, wzdx, community, benchmarks.
DISABLED = ""
ROUTING = "osrm-demo"
SEARCH = "nominatim"

# Budget counters. Create with: npx wrangler kv namespace create BUDGET, then paste the id here.
[[kv_namespaces]]
binding = "BUDGET"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never in this file): npx wrangler secret put GOOGLE_KEY / NREL_KEY / CLIENT_SALT

# Shared gas price reports (optional, off without it). Create with: npx wrangler d1 create exitatlas-prices,
# paste the database_id here, uncomment, then run: npx wrangler d1 execute exitatlas-prices --remote --file schema.sql
# [[d1_databases]]
# binding = "PRICES_DB"
# database_name = "exitatlas-prices"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"
